<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Selected systems — featured projects</title>
  <desc id="d">Six project modules arranged as a technical rack connected by a bus line. Project names are placeholders to be replaced with real repositories.</desc>

  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2530" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="#05070A"/>
  <rect width="1200" height="340" fill="url(#g)" opacity="0.3"/>

  <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#7A8B9C" letter-spacing="1.3">SELECTED SYSTEMS</text>
  <text x="1184" y="26" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.8">06 modules · bus 0 · 0x7f3a9c21</text>
  <line x1="16" y1="34" x2="1184" y2="34" stroke="#1C2530" stroke-width="1"/>

  <!-- ══════════ BUS / CONNECTOR ROUTING ══════════
       A horizontal spine with risers into each module, like a backplane. -->
  <g stroke="#1C2530" stroke-width="1" fill="none">
    <path d="M28 58 H1172"/>
    <path d="M200 58 V74"/>
    <path d="M580 58 V74"/>
    <path d="M960 58 V74"/>
    <path d="M200 186 V210"/>
    <path d="M580 186 V210"/>
    <path d="M960 186 V210"/>
  </g>
  <!-- junction dots on the spine -->
  <g fill="#2A3644">
    <rect x="197" y="55" width="6" height="6" rx="1"/>
    <rect x="577" y="55" width="6" height="6" rx="1"/>
    <rect x="957" y="55" width="6" height="6" rx="1"/>
    <rect x="197" y="183" width="6" height="6" rx="1"/>
    <rect x="577" y="183" width="6" height="6" rx="1"/>
    <rect x="957" y="183" width="6" height="6" rx="1"/>
  </g>
  <!-- a dim pulse travelling the spine: the one animation on this panel -->
  <circle r="2.5" fill="#4DD9E8" opacity="0.8">
    <animateMotion dur="7s" begin="-1.5s" repeatCount="indefinite"
                   path="M28 58 H1172" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.8;1"
             dur="7s" begin="-1.5s" calcMode="spline"
             keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>

  <!-- ══════════════════════════════════════════════════════════════════
       MODULES — placeholder project names. Replace the name, description
       and tech lines, and point the README link at your real repository.
       Markers: EDIT:PROJECT:n:BEGIN / :END
       ══════════════════════════════════════════════════════════════════ -->

  <!-- EDIT:PROJECT:1:BEGIN -->
  <g>
    <rect x="28" y="74" width="344" height="112" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
    <g stroke="#2A3644" stroke-width="1" fill="none" opacity="0.8"><path d="M28 86V74h12"/></g>
