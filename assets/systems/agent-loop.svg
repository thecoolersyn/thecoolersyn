<svg xmlns="http://www.w3.org/2000/svg" width="420" height="270" viewBox="0 0 420 270" role="img" aria-labelledby="t d">
  <title id="t">Agent loop</title>
  <desc id="d">A circular diagram of an AI agent loop with four stages — observe, plan, act, verify — connected in a cycle. A token travels the loop while a progress arc grows, and a step counter advances in step.</desc>

  <defs>
    <!-- ring track, local coords centred on the gauge origin, r=70 -->
    <circle id="ring" cx="0" cy="0" r="70" fill="none"/>
  </defs>

  <rect width="420" height="270" fill="#05070A"/>
  <rect x="8" y="8" width="404" height="254" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
  <g stroke="#2A3644" stroke-width="1" fill="none" opacity="0.8">
    <path d="M8 20V8h12"/><path d="M400 8h12v12"/><path d="M412 250v12h-12"/><path d="M20 262H8v-12"/>
  </g>

  <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#7A8B9C" letter-spacing="1.3">AGENT LOOP</text>
  <text x="396" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.9">illustrative</text>

  <!-- step counter: discrete swaps on the same keyTimes as the progress arc -->
  <g text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="10" fill="#4DD9E8" letter-spacing="0.6">
    <text x="396" y="52" opacity="1">step 1/12
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.28" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="396" y="52" opacity="0">step 2/12
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.28;0.56" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="396" y="52" opacity="0">step 3/12
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.56;0.82" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="396" y="52" opacity="0">step 4/12
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.82;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(210 136)">
    <!-- ring track -->
    <use href="#ring" stroke="#1C2530" stroke-width="1.5"/>
    <!-- progress arc: one quarter (110 of a 440 circumference) per step -->
    <use href="#ring" stroke="#4DD9E8" stroke-width="2" stroke-linecap="round"
         stroke-dasharray="110 330" stroke-dashoffset="0" opacity="0.85" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" values="110 330;220 220;330 110;330 110;110 330"
               keyTimes="0;0.28;0.56;0.72;1" dur="9s" calcMode="spline"
               keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" repeatCount="indefinite"/>
    </use>

    <!-- four stage nodes at 90° intervals starting at the top:
         top (0,-70) · right (70,0) · bottom (0,70) · left (-70,0) -->
    <g>
      <circle cx="0" cy="-70" r="8" fill="#0A0E14" stroke="#2A3644" stroke-width="1"/>
      <circle cx="70" cy="0" r="8" fill="#0A0E14" stroke="#2A3644" stroke-width="1"/>
      <circle cx="0" cy="70" r="8" fill="#0A0E14" stroke="#2A3644" stroke-width="1"/>
      <circle cx="-70" cy="0" r="8" fill="#0A0E14" stroke="#2A3644" stroke-width="1"/>
    </g>

    <!-- active-stage halos, staggered to follow the token -->
    <circle cx="0" cy="-70" r="8" fill="none" stroke="#4DD9E8" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.28" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="0" r="8" fill="none" stroke="#4DD9E8" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.28;0.4;0.56" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="70" r="8" fill="none" stroke="#4DD9E8" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.56;0.68;0.82" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-70" cy="0" r="8" fill="none" stroke="#4DD9E8" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.82;0.9;1" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- stage labels, inside the ring -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9"
       text-anchor="middle" letter-spacing="0.8">
      <text x="0" y="-86" fill="#C9D4E0">OBSERVE</text>
      <text x="70" y="-16" fill="#C9D4E0">PLAN</text>
      <text x="0" y="90" fill="#C9D4E0">ACT</text>
      <text x="-70" y="-16" fill="#C9D4E0">VERIFY</text>
    </g>

    <!-- token travelling the ring. A rotate transform is used rather than
         animateMotion: same visual result, no path-resolution ambiguity. -->
    <g>
      <circle cx="0" cy="-70" r="3" fill="#9B7BFF"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;90;180;270;360" keyTimes="0;0.25;0.5;0.75;1" dur="9s"
                        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
                        repeatCount="indefinite"/>
    </g>

    <!-- hub -->
    <circle r="25" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
    <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text y="-4" font-size="8" fill="#46586A" letter-spacing="1.2">BUDGET</text>
      <text y="10" font-size="13" fill="#C9D4E0" letter-spacing="0.4">12</text>
    </g>
  </g>

  <text x="24" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.7">observe → plan → act → verify</text>
  <text x="396" y="250" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.7">mcp · tools · retry</text>
</svg>
