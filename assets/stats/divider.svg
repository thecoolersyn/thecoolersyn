<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-labelledby="t d">
  <title id="t">Section divider</title>
  <desc id="d">A minimal hairline divider with a centred diamond and a very slowly drifting dim segment.</desc>

  <rect width="1200" height="24" fill="#05070A"/>

  <line x1="40" y1="12" x2="578" y2="12" stroke="#1C2530" stroke-width="1"/>
  <line x1="622" y1="12" x2="1160" y2="12" stroke="#1C2530" stroke-width="1"/>

  <path d="M600 7 L605 12 L600 17 L595 12 Z" fill="#2A3644"/>

  <!-- a dim segment that drifts back and forth along the left rule -->
  <rect x="40" y="11" width="60" height="2" fill="#4DD9E8" opacity="0.25">
    <animate attributeName="x" values="40;300;120;480;40" keyTimes="0;0.3;0.55;0.8;1"
             dur="13s" calcMode="spline"
             keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.5;0.2;0.25" keyTimes="0;0.4;0.75;1"
             dur="13s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
             repeatCount="indefinite"/>
  </rect>
</svg>
