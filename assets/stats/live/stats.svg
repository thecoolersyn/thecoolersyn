<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="t d">
  <title id="t">GitHub statistics — placeholder</title>
  <desc id="d">Placeholder card. Run the Update README cards GitHub Actions workflow to replace this with real statistics.</desc>

  <rect width="480" height="200" fill="#0A0E14"/>
  <rect x="0.5" y="0.5" width="479" height="199" fill="none" stroke="#1C2530" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="24" y="40" font-size="15" fill="#4DD9E8" letter-spacing="0.4">GitHub Stats</text>
    <line x1="24" y1="52" x2="456" y2="52" stroke="#1C2530" stroke-width="1"/>

    <text x="24" y="78" font-size="10" fill="#46586A" letter-spacing="1.2">NOT YET GENERATED</text>
    <text x="24" y="102" font-size="11" fill="#7A8B9C">This card is a placeholder.</text>
    <text x="24" y="122" font-size="11" fill="#7A8B9C">Run the “Update README cards” workflow to</text>
    <text x="24" y="142" font-size="11" fill="#7A8B9C">replace it with real public statistics.</text>

    <text x="24" y="176" font-size="9" fill="#46586A" letter-spacing="0.7">repo → Actions → Update README cards → Run workflow</text>
  </g>
</svg>
