<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-labelledby="t d">
  <title id="t">HUD divider frame</title>
  <desc id="d">A thin decorative separator with hairline rules and corner crop marks. A single dim dot drifts slowly along the top rule.</desc>

  <rect width="1200" height="48" fill="#05070A"/>

  <line x1="60" y1="10" x2="1140" y2="10" stroke="#1C2530" stroke-width="1"/>
  <line x1="60" y1="38" x2="1140" y2="38" stroke="#1C2530" stroke-width="1"/>

  <g stroke="#2A3644" stroke-width="1" fill="none" opacity="0.85">
    <path d="M60 10V22"/><path d="M1140 10V22"/>
    <path d="M60 38V26"/><path d="M1140 38V26"/>
  </g>

  <circle r="2" fill="#4DD9E8" opacity="0.6">
    <animateMotion dur="11s" begin="-2s" repeatCount="indefinite"
                   path="M60 10 H1140" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0.15;0.6;0.6;0.15" keyTimes="0;0.12;0.82;1"
             dur="11s" begin="-2s" calcMode="spline"
             keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>
</svg>
