<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="420" height="270" viewBox="0 0 420 270" role="img" aria-labelledby="t d">
  <title id="t">Animated tachometer</title>
  <desc id="d">A minimal HUD tachometer. A cyan arc and needle sweep smoothly back and forth across the range while a digital RPM readout changes in step. Simulated values.</desc>

  <!--
    Geometry (all path coords are LOCAL to the translated gauge group):
      centre (0,0) · radius 84 · sweep 220° from -110° to +110°
      arc length 2*pi*84*220/360 = 322.5
      angle(fraction f) = -110 + 220*f
  -->
  <defs>
    <path id="track" d="M-78.9 28.7 A 84 84 0 1 1 78.9 28.7" fill="none"/>
  </defs>

  <rect width="420" height="270" fill="#05070A"/>
  <rect x="8" y="8" width="404" height="254" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
  <g stroke="#2A3644" stroke-width="1" fill="none" opacity="0.8">
    <path d="M8 20V8h12"/><path d="M400 8h12v12"/><path d="M412 250v12h-12"/><path d="M20 262H8v-12"/>
  </g>

  <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#7A8B9C" letter-spacing="1.3">TACHOMETER</text>
  <text x="396" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.9">SIM</text>

  <g transform="translate(210 146)">
    <!-- track + caution + redline -->
    <use href="#track" xlink:href="#track" stroke="#1C2530" stroke-width="5"/>
    <path d="M73.9 -40.0 A 84 84 0 0 1 83.5 -9.4" fill="none" stroke="#E8B44D" stroke-width="5" stroke-opacity="0.4"/>
    <path d="M83.5 -9.4 A 84 84 0 0 1 78.9 28.7" fill="none" stroke="#FF5C7A" stroke-width="5" stroke-opacity="0.55"/>

    <!-- minor ticks: every 0.5 -->
    <g stroke="#2A3644" stroke-width="1">
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-110.00)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-100.83)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-91.67)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-82.50)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-73.33)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-64.17)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-55.00)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-45.83)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-36.67)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-27.50)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-18.33)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(-9.17)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(0.00)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(9.17)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(18.33)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(27.50)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(36.67)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(45.83)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(55.00)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(64.17)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(73.33)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(82.50)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(91.67)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(100.83)"/>
      <line x1="0" y1="-76" x2="0" y2="-69" transform="rotate(110.00)"/>
    </g>

    <!-- major ticks: every 1 -->
    <g stroke="#46586A" stroke-width="1.4">
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(-110.00)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(-91.67)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(-73.33)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(-55.00)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(-36.67)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(-18.33)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(0.00)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(18.33)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(36.67)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(55.00)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(73.33)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(91.67)"/>
      <line x1="0" y1="-84" x2="0" y2="-65" transform="rotate(110.00)"/>
    </g>

    <!-- numerals at r=50, computed from the same angle() function as the ticks -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9"
       fill="#7A8B9C" text-anchor="middle" dominant-baseline="central" letter-spacing="0.3">
      <text x="-47.0" y="17.1">0</text>
      <text x="-50.0" y="1.5">1</text>
      <text x="-47.9" y="-14.3">2</text>
      <text x="-41.0" y="-28.7">3</text>
      <text x="-29.9" y="-40.1">4</text>
      <text x="-15.7" y="-47.5">5</text>
      <text x="0.0" y="-50.0">6</text>
      <text x="15.7" y="-47.5">7</text>
      <text x="29.9" y="-40.1">8</text>
      <text x="41.0" y="-28.7">9</text>
      <text x="47.9" y="-14.3">10</text>
      <text x="50.0" y="1.5">11</text>
      <text x="47.0" y="17.1">12</text>
    </g>

    <!-- progress arc: dashoffset sweeps the fill up the 322.5-long track -->
    <use href="#track" xlink:href="#track" stroke="#4DD9E8" stroke-width="5"
         stroke-dasharray="322.5" stroke-dashoffset="322.5">
      <animate attributeName="stroke-dashoffset" values="322.5;322.5;18;322.5;110;322.5"
               keyTimes="0;0.06;0.38;0.6;0.82;1" dur="10s" calcMode="spline"
               keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
               repeatCount="indefinite"/>
    </use>

    <!-- needle: identical keyTimes/dur as the arc, mapped onto the same -110..110 range -->
    <g>
      <line x1="0" y1="6" x2="0" y2="-72" stroke="#C9D4E0" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="0" cy="-72" r="2" fill="#C9D4E0"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="-110;-110;110;-110;110;-110" keyTimes="0;0.06;0.38;0.6;0.82;1" dur="10s"
                        calcMode="spline"
                        keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
                        repeatCount="indefinite"/>
    </g>

    <!-- hub -->
    <circle r="7" fill="#0A0E14" stroke="#2A3644" stroke-width="1"/>
    <circle r="2" fill="#4DD9E8" opacity="0.85"/>

    <text y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="9" fill="#46586A" letter-spacing="1.6">RPM ×1000</text>

    <!-- Digital readout. SMIL cannot tween text content, so each value is a
         separate <text> switched with calcMode="discrete" on the SAME keyTimes
         as the needle, which keeps it in step with the sweep. -->
    <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="17" fill="#C9D4E0" letter-spacing="0.5">
      <text y="72" opacity="1">1 240
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.06" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text y="72" opacity="0">3 480
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.06;0.16" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text y="72" opacity="0">5 760
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.16;0.26" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text y="72" opacity="0">8 040
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.26;0.38" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text y="72" opacity="0">6 220
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.38;0.60" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text y="72" opacity="0">9 480
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.60;0.82" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text y="72" opacity="0">7 140
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.82;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
      <text y="72" opacity="0">1 240
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <text x="24" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.7">simulated · no real instrument data</text>
  <text x="396" y="250" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.7">errno 0</text>
</svg>
