<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Garage — motorcycle engineering drawing with simulated telemetry</title>
  <desc id="d">A blueprint-style side elevation of a naked motorcycle with wheelbase and seat-height dimensions and engineering callouts, beside simulated engine telemetry readouts. A hobby project schematic, not real instrument data.</desc>

  <defs>
    <pattern id="bg-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1C2530" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="bg-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#2A3644" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#05070A"/>

  <!-- ══════════ TITLE STRIP ══════════ -->
  <rect x="16" y="16" width="1168" height="34" rx="2" fill="#111823" stroke="#1C2530" stroke-width="1"/>
  <g stroke="#2A3644" stroke-width="1" fill="none" opacity="0.8">
    <path d="M16 28V16h12"/><path d="M1172 16h12v12"/>
  </g>
  <text x="32" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#C9D4E0" letter-spacing="1.4">ENGINEERING DRAWING</text>
  <text x="252" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#7A8B9C" letter-spacing="1.2">SIDE ELEVATION · NAKED</text>
  <text x="1168" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.8">scale 1:12 · rev 0.4 · 0x7f3a9c21</text>

  <!-- ══════════ BLUEPRINT VIEWPORT ══════════ -->
  <rect x="16" y="66" width="760" height="238" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
  <rect x="16" y="66" width="760" height="238" fill="url(#bg-grid)"/>
  <rect x="16" y="66" width="760" height="238" fill="url(#bg-grid-major)" opacity="0.6"/>
  <text x="40" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.7">ch. 02/07 · tolerance ±0.05</text>

  <!-- ══════════ MOTORCYCLE — thin line art, side profile ══════════
       Geometry: ground y=286 · wheels r=38, axles y=248
       front axle (255,248) · rear axle (585,248) · fork top (340,110)
       Steering axis rakes ~29° back from vertical. Front of bike = left.
  -->
  <g fill="none" stroke="#4DD9E8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- ground -->
    <line x1="60" y1="286" x2="740" y2="286" stroke="#1C2530" stroke-width="1"/>

    <!-- ── wheels ── -->
    <circle cx="255" cy="248" r="38"/>
    <circle cx="255" cy="248" r="14" opacity="0.55"/>
    <circle cx="255" cy="248" r="3.5" opacity="0.5"/>
    <circle cx="585" cy="248" r="38"/>
    <circle cx="585" cy="248" r="14" opacity="0.55"/>
    <circle cx="585" cy="248" r="17" opacity="0.4" stroke-dasharray="3 4"/>
    <!-- hub spokes -->
    <g stroke-width="1" opacity="0.3">
      <line x1="221" y1="248" x2="289" y2="248"/>
      <line x1="255" y1="214" x2="255" y2="282"/>
      <line x1="255" y1="222" x2="255" y2="274"/>
      <line x1="585" y1="214" x2="585" y2="282"/>
      <line x1="563" y1="226" x2="607" y2="270"/>
      <line x1="607" y1="226" x2="563" y2="270"/>
    </g>

    <!-- ── front fork + steering stem ── -->
    <line x1="255" y1="248" x2="340" y2="110" opacity="0.9"/>
    <line x1="263" y1="252" x2="346" y2="120" opacity="0.45"/>
    <!-- triple clamps -->
    <line x1="330" y1="108" x2="352" y2="116" opacity="0.75"/>
    <!-- handlebar sweeping back to the rider -->
    <path d="M340 110 L368 100 L392 104" opacity="0.8"/>
    <path d="M340 110 L320 118" opacity="0.55"/>

    <!-- ── bodywork: tank → seat → tail (bezier, organic) ── -->
    <path d="M344 152 C352 138 374 132 396 136 C412 139 424 145 434 154" opacity="0.95"/>
    <path d="M434 154 C450 158 466 160 478 156" opacity="0.85"/>
    <path d="M478 156 C494 153 508 150 514 145 C518 152 519 160 519 168" opacity="0.8"/>
    <path d="M344 152 C340 160 340 168 344 176" opacity="0.7"/>

    <!-- ── frame ── -->
    <path d="M340 116 L338 176 L346 214 L368 244" opacity="0.85"/>
    <path d="M430 158 L424 214 L424 244" opacity="0.7"/>
    <path d="M478 160 L470 206 L424 244" opacity="0.55"/>
    <!-- swingarm pivot + arm -->
    <circle cx="424" cy="246" r="5" opacity="0.75"/>
    <line x1="424" y1="246" x2="585" y2="248" opacity="0.85"/>
    <path d="M424 250 L585 250" opacity="0.3" stroke-dasharray="2 3"/>

    <!-- ── engine ── -->
    <path d="M362 206 L362 258 L420 258 L420 206" opacity="0.85"/>
    <g stroke-width="1" opacity="0.35">
      <line x1="370" y1="212" x2="370" y2="238"/>
      <line x1="380" y1="212" x2="380" y2="238"/>
      <line x1="390" y1="212" x2="390" y2="238"/>
      <line x1="400" y1="212" x2="400" y2="238"/>
    </g>
    <!-- exhaust header sweeping back to a canister -->
    <path d="M420 236 C448 248 476 254 508 252 L548 250" opacity="0.7"/>
    <path d="M540 244 L566 246 L566 258 L540 258" opacity="0.55"/>

    <!-- ── radiator ── -->
    <path d="M330 176 L346 176 L346 210 L330 210" opacity="0.5"/>
    <g stroke-width="1" opacity="0.28">
      <line x1="332" y1="182" x2="344" y2="182"/>
      <line x1="332" y1="190" x2="344" y2="190"/>
      <line x1="332" y1="198" x2="344" y2="198"/>
    </g>

    <!-- ── rear shock + hugger ── -->
    <line x1="474" y1="176" x2="486" y2="228" opacity="0.5"/>
    <path d="M556 214 A 44 44 0 0 1 600 224" opacity="0.4"/>
    <!-- front fender over the wheel -->
    <path d="M212 230 A 46 46 0 0 1 290 216" opacity="0.45"/>

    <!-- footpeg -->
    <line x1="428" y1="264" x2="442" y2="264" opacity="0.6"/>
  </g>

  <!-- slow travelling highlight along the frame downtube -->
  <g fill="none" stroke="#4DD9E8" stroke-width="1.8" stroke-linecap="round" opacity="0">
    <path d="M340 116 L338 176 L346 214 L368 244"/>
    <animateMotion dur="10s" begin="-1s" repeatCount="indefinite"
                   path="M340 116 L338 176 L346 214 L368 244" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.12;0.58;0.76"
             dur="10s" begin="-1s" calcMode="spline"
             keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </g>

  <!-- ══════════ DIMENSIONS ══════════ -->
  <!-- wheelbase, below the bike -->
  <g stroke="#46586A" stroke-width="1" fill="none">
    <line x1="255" y1="298" x2="585" y2="298"/>
    <line x1="255" y1="288" x2="255" y2="302"/>
    <line x1="585" y1="288" x2="585" y2="302"/>
  </g>
  <path d="M255 298 l6 -2.5 v5 z" fill="#46586A"/>
  <path d="M585 298 l-6 -2.5 v5 z" fill="#46586A"/>
  <text x="420" y="294" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#7A8B9C" letter-spacing="0.6">1400 mm</text>

  <!-- seat height, far left, clear of the bike -->
  <g stroke="#46586A" stroke-width="1" fill="none">
    <line x1="118" y1="156" x2="118" y2="286"/>
    <line x1="112" y1="156" x2="124" y2="156"/>
    <line x1="112" y1="286" x2="124" y2="286"/>
  </g>
  <path d="M118 156 l-2.5 6 h5 z" fill="#46586A"/>
  <path d="M118 286 l-2.5 -6 h5 z" fill="#46586A"/>
  <text x="108" y="218" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#7A8B9C" letter-spacing="0.6">790</text>
  <text x="108" y="230" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#7A8B9C" letter-spacing="0.6">mm</text>

  <!-- ══════════ CALLOUTS ══════════ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.6">
    <g stroke="#2A3644" stroke-width="1" fill="none">
      <circle cx="338" cy="194" r="6"/><line x1="332" y1="190" x2="286" y2="150"/>
      <circle cx="392" cy="232" r="6"/><line x1="392" y1="238" x2="392" y2="266"/>
      <circle cx="340" cy="112" r="6"/><line x1="346" y1="108" x2="404" y2="96"/>
      <circle cx="520" cy="240" r="6"/><line x1="526" y1="244" x2="600" y2="272"/>
    </g>
    <text x="282" y="146" text-anchor="end" fill="#7A8B9C">RADIATOR</text>
    <text x="392" y="280" text-anchor="middle" fill="#7A8B9C">CRANKCASE</text>
    <text x="408" y="92" fill="#7A8B9C">FR. FORK ⌀43</text>
    <text x="604" y="276" fill="#7A8B9C">SWINGARM</text>
  </g>

  <!-- ══════════ TELEMETRY COLUMN ══════════ -->
  <rect x="792" y="66" width="392" height="238" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>

  <text x="808" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#7A8B9C" letter-spacing="1.3">SPEC</text>
  <line x1="808" y1="94" x2="1168" y2="94" stroke="#1C2530" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
    <text x="808" y="112" fill="#46586A">bore</text>
    <text x="1168" y="112" text-anchor="end" fill="#C9D4E0">96.0</text>
    <text x="808" y="130" fill="#46586A">stroke</text>
    <text x="1168" y="130" text-anchor="end" fill="#C9D4E0">75.5</text>
    <text x="808" y="148" fill="#46586A">ratio</text>
    <text x="1168" y="148" text-anchor="end" fill="#C9D4E0">12.5:1</text>
    <text x="808" y="166" fill="#46586A">mass</text>
    <!-- mass value: two texts swapped discretely, so they never overlap -->
    <text x="1168" y="166" text-anchor="end" fill="#C9D4E0" opacity="1">188 kg
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
    <text x="1168" y="166" text-anchor="end" fill="#4DD9E8" opacity="0">188.4 kg
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5;0.92;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    </text>
  </g>
  <line x1="808" y1="178" x2="1168" y2="178" stroke="#1C2530" stroke-width="1"/>

  <!-- pressure curve -->
  <text x="808" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#7A8B9C" letter-spacing="1.3">PRESSURE</text>
  <line x1="808" y1="238" x2="1168" y2="238" stroke="#1C2530" stroke-width="1"/>
  <line x1="808" y1="220" x2="1168" y2="220" stroke="#1C2530" stroke-width="1" opacity="0.5"/>
  <path d="M808 234 C840 232 856 224 880 226 C906 228 918 210 944 212 C972 214 986 204 1012 206
           C1040 208 1054 214 1080 212 C1106 210 1130 216 1168 214"
        fill="none" stroke="#3DDC97" stroke-width="1.2" opacity="0.65" stroke-linecap="round"/>
  <circle cx="1080" cy="212" r="2.5" fill="#3DDC97" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>
  <text x="1168" y="204" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#7A8B9C">2.14 bar</text>
  <text x="808" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.6">coolant 82° · oil 96°</text>

  <!-- load meter with amber caution zone -->
  <text x="808" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.8">LOAD</text>
  <rect x="852" y="266" width="280" height="8" fill="#111823"/>
  <rect x="1104" y="266" width="28" height="8" fill="#E8B44D" fill-opacity="0.28"/>
  <rect x="852" y="266" width="280" height="8" fill="#4DD9E8" fill-opacity="0.7">
    <animate attributeName="width" values="172;214;150;232;188;172" keyTimes="0;0.2;0.4;0.6;0.8;1"
             dur="11s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
             repeatCount="indefinite"/>
  </rect>
  <text x="1168" y="292" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.6">hobby · schematic reference · simulated telemetry</text>
</svg>
