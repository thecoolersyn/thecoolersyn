<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Computing environment</title>
  <desc id="d">Operating systems ordered by how they are actually used. macOS is the primary operating system. Windows is the secondary operating system. Fedora is an occasional dual-boot Linux environment used for small networking tasks. Linux Mint and Arch were previously used and are no longer installed. Bar length encodes relative weight of use.</desc>

  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2530" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#05070A"/>
  <rect width="1200" height="300" fill="url(#g)" opacity="0.3"/>

  <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#7A8B9C" letter-spacing="1.3">ENVIRONMENT</text>
  <text x="1184" y="26" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.8">darwin · arm64 · bash 5.2 · 0x7f3a9c21</text>
  <line x1="16" y1="34" x2="1184" y2="34" stroke="#1C2530" stroke-width="1"/>

  <!--
    ── hierarchy ───────────────────────────────────────────────────────────
    Order, status colour and bar length all encode how current each OS is.
    Fedora is NOT a regular environment — it is booted occasionally for
    specific networking work, so it sits below the always-present Windows.
       macOS    primary OS        1168px  cyan
       windows  secondary OS       620px  green
       fedora   occasional/dual    330px  dim
       mint     previously used    176px  faint
  -->

  <!-- ══ macOS · primary ══ -->
  <g>
    <rect x="16" y="48" width="1168" height="52" rx="2" fill="#0A0E14" stroke="#4DD9E8" stroke-width="1"/>
    <rect x="16" y="48" width="3" height="52" fill="#4DD9E8"/>
    <rect x="28" y="60" width="2" height="28" fill="#4DD9E8" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.4s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
    </rect>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="44" y="80" font-size="14" fill="#C9D4E0" letter-spacing="0.3">macOS</text>
      <text x="150" y="80" font-size="10" fill="#4DD9E8" letter-spacing="1.2">PRIMARY OS</text>
      <text x="270" y="80" font-size="9" fill="#46586A" letter-spacing="0.6">daily driver · darwin · arm64 · zsh · brew</text>
    </g>
    <rect x="16" y="92" width="1168" height="2" fill="#111823"/>
    <rect x="16" y="92" width="1168" height="2" fill="#4DD9E8" fill-opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.45;0.7" keyTimes="0;0.5;1" dur="6s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ Windows · secondary ══ -->
  <g>
    <rect x="16" y="110" width="1168" height="52" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
    <rect x="16" y="110" width="3" height="52" fill="#3DDC97" fill-opacity="0.8"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="44" y="142" font-size="14" fill="#C9D4E0" letter-spacing="0.3">Windows</text>
      <text x="150" y="142" font-size="10" fill="#3DDC97" letter-spacing="1.2">SECONDARY OS</text>
      <text x="290" y="142" font-size="9" fill="#46586A" letter-spacing="0.6">windows · wsl2 · cross-platform checks</text>
    </g>
    <rect x="16" y="154" width="1168" height="2" fill="#111823"/>
    <rect x="16" y="154" width="620" height="2" fill="#3DDC97" fill-opacity="0.55"/>
  </g>

  <!-- ══ Fedora · occasional dual boot ══ -->
  <g>
    <rect x="16" y="172" width="1168" height="52" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
    <rect x="16" y="172" width="3" height="52" fill="#7A8B9C" fill-opacity="0.55"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="44" y="204" font-size="14" fill="#7A8B9C" letter-spacing="0.3">Fedora</text>
      <text x="150" y="204" font-size="10" fill="#7A8B9C" letter-spacing="1.2">OCCASIONAL · DUAL BOOT</text>
      <text x="360" y="204" font-size="9" fill="#46586A" letter-spacing="0.6">booted when needed for small networking tasks</text>
    </g>
    <rect x="16" y="216" width="1168" height="2" fill="#111823"/>
    <rect x="16" y="216" width="330" height="2" fill="#7A8B9C" fill-opacity="0.35"/>
  </g>

  <!-- ══ Linux Mint / Arch · previously used ══ -->
  <g>
    <rect x="16" y="234" width="1168" height="50" rx="2" fill="#0A0E14" stroke="#1C2530" stroke-width="1"/>
    <rect x="16" y="234" width="3" height="50" fill="#2A3644"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="44" y="258" font-size="14" fill="#46586A" letter-spacing="0.3">Mint / Arch</text>
      <text x="180" y="258" font-size="10" fill="#46586A" letter-spacing="1.2">PREVIOUSLY USED</text>
      <text x="360" y="258" font-size="9" fill="#46586A" letter-spacing="0.6">linux mint · arch — no longer installed</text>
    </g>
    <rect x="16" y="268" width="1168" height="2" fill="#111823"/>
    <rect x="16" y="268" width="176" height="2" fill="#2A3644" fill-opacity="0.7"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#46586A" letter-spacing="0.7">
    <text x="16" y="292">bar length = relative weight of use · $ uname -a</text>
    <text x="1184" y="292" text-anchor="end">fedora is not installed by default · dual boot only</text>
  </g>
</svg>
