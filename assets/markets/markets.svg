      <!-- u: up candles, cyan -->
      <g stroke="#4DD9E8" fill="#4DD9E8">
        <line x1="100" y1="118" x2="100" y2="162" stroke-width="1" opacity="0.75"/>
        <rect x="96"  y="126" width="8" height="28" fill-opacity="0.42"/>
        <line x1="128" y1="140" x2="128" y2="188" stroke-width="1" opacity="0.75"/>
        <rect x="124" y="148" width="8" height="32" fill-opacity="0.42"/>
        <line x1="156" y1="158" x2="156" y2="206" stroke-width="1" opacity="0.75"/>
        <rect x="152" y="166" width="8" height="32" fill-opacity="0.42"/>
        <line x1="184" y1="130" x2="184" y2="176" stroke-width="1" opacity="0.75"/>
        <rect x="180" y="138" width="8" height="30" fill-opacity="0.42"/>
        <line x1="212" y1="146" x2="212" y2="190" stroke-width="1" opacity="0.75"/>
        <rect x="208" y="154" width="8" height="28" fill-opacity="0.42"/>
        <line x1="240" y1="112" x2="240" y2="158" stroke-width="1" opacity="0.75"/>
        <rect x="236" y="120" width="8" height="30" fill-opacity="0.42"/>
        <line x1="268" y1="120" x2="268" y2="166" stroke-width="1" opacity="0.75"/>
        <rect x="264" y="128" width="8" height="30" fill-opacity="0.42"/>
        <line x1="310" y1="126" x2="310" y2="170" stroke-width="1" opacity="0.75"/>
        <rect x="306" y="134" width="8" height="28" fill-opacity="0.42"/>
        <line x1="366" y1="106" x2="366" y2="152" stroke-width="1" opacity="0.75"/>
