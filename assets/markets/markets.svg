<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Code and markets — market microstructure panel</title>
  <desc id="d">A simulated candlestick chart with a moving average, volume histogram, support level, and a quantitative terminal readout showing spread, latency and a depth ladder. All values are synthetic and are not investment data.</desc>

  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
