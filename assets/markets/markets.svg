    <text x="64" y="76">112.00</text>
    <text x="64" y="126">110.00</text>
    <text x="64" y="176">108.00</text>
    <text x="64" y="226">106.00</text>
    <text x="64" y="276">104.00</text>
  </g>
  <g stroke="#1C2530" stroke-width="1" opacity="0.6">
    <line x1="72" y1="72" x2="788" y2="72"/>
    <line x1="72" y1="122" x2="788" y2="122"/>
    <line x1="72" y1="172" x2="788" y2="172"/>
    <line x1="72" y1="222" x2="788" y2="222"/>
    <line x1="72" y1="272" x2="788" y2="272"/>
