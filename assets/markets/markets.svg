    <text x="884" y="284" fill="#C9D4E0">109.64</text>
    <text x="1168" y="284" text-anchor="end" fill="#7A8B9C">718</text>
    <rect x="884" y="274" width="102" height="10" fill="#FF5C7A" fill-opacity="0.12"/>
  </g>

  <!-- order-flow sparkline, bottom of panel -->
  <line x1="820" y1="294" x2="1168" y2="294" stroke="#1C2530" stroke-width="1"/>
  <g>
    <path d="M820 310 L848 306 L876 309 L904 303 L932 307 L960 300 L988 304 L1016 298
