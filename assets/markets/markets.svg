    <g>
      <!-- d: down candles, red, low opacity -->
      <g stroke="#FF5C7A" fill="#FF5C7A">
        <line x1="86"  y1="92"  x2="86"  y2="140" stroke-width="1" opacity="0.6"/>
        <rect x="82"  y="100" width="8" height="34" fill-opacity="0.28"/>
        <line x1="114" y1="106" x2="114" y2="158" stroke-width="1" opacity="0.6"/>
        <rect x="110" y="114" width="8" height="36" fill-opacity="0.28"/>
        <line x1="142" y1="122" x2="142" y2="176" stroke-width="1" opacity="0.6"/>
        <rect x="138" y="130" width="8" height="38" fill-opacity="0.28"/>
        <line x1="198" y1="150" x2="198" y2="196" stroke-width="1" opacity="0.6"/>
        <rect x="194" y="158" width="8" height="30" fill-opacity="0.28"/>
        <line x1="282" y1="140" x2="282" y2="188" stroke-width="1" opacity="0.6"/>
        <rect x="278" y="148" width="8" height="32" fill-opacity="0.28"/>
