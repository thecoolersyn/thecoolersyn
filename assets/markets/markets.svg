  <text x="820" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#46586A" letter-spacing="0.6">order flow · Δt=0.031s · Σ=1024</text>

  <!-- ══════════ FOOTER ══════════ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.7">
    <text x="16" y="332" fill="#46586A">synthetic feed · not investment data · not financial advice · λ=0.0021</text>
    <text x="1184" y="332" text-anchor="end" fill="#46586A">O(1) amortized · 0xdeadbeef</text>
