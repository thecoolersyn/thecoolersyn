        <rect x="726" y="92"  width="8" height="28" fill-opacity="0.42"/>
      </g>

      <!-- moving average: smooth polyline, dim cyan -->
      <path d="M90 168 L118 156 L146 178 L174 158 L202 168 L230 138 L258 146 L286 158 L314 142
               L342 170 L370 132 L398 140 L426 112 L454 138 L482 130 L510 154 L538 116 L566 104
               L594 140 L622 128 L650 150 L678 132 L706 112 L734 100"
            fill="none" stroke="#4DD9E8" stroke-width="1.2" opacity="0.5"
            stroke-linejoin="round" stroke-linecap="round"/>
      <!-- MA drifts slightly to read as "live" -->
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,2;0,0"
                        keyTimes="0;0.35;0.7;1" dur="13s" calcMode="spline"
                        keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>

      <!-- the live (rightmost) candle re-draws -->
      <g>
        <line x1="758" y1="76" x2="758" y2="122" stroke="#4DD9E8" stroke-width="1" opacity="0.85">
