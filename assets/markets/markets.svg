      <rect x="278" y="254" width="8" height="18" fill-opacity="0.26"/>
      <rect x="306" y="248" width="8" height="24" fill-opacity="0.32"/>
      <rect x="334" y="258" width="8" height="14" fill-opacity="0.20"/>
      <rect x="362" y="244" width="8" height="28" fill-opacity="0.38"/>
      <rect x="390" y="250" width="8" height="22" fill-opacity="0.30"/>
      <rect x="418" y="240" width="8" height="32" fill-opacity="0.42"/>
      <rect x="446" y="252" width="8" height="20" fill-opacity="0.28"/>
      <rect x="474" y="248" width="8" height="24" fill-opacity="0.32"/>
      <rect x="502" y="256" width="8" height="16" fill-opacity="0.22"/>
      <rect x="530" y="242" width="8" height="30" fill-opacity="0.40"/>
      <rect x="558" y="238" width="8" height="34" fill-opacity="0.44"/>
      <rect x="586" y="252" width="8" height="20" fill-opacity="0.28"/>
      <rect x="614" y="254" width="8" height="18" fill-opacity="0.24"/>
      <rect x="642" y="246" width="8" height="26" fill-opacity="0.36"/>
      <rect x="670" y="258" width="8" height="14" fill-opacity="0.20"/>
      <rect x="698" y="244" width="8" height="28" fill-opacity="0.38"/>
