        <rect x="446" y="140" width="8" height="32" fill-opacity="0.28"/>
        <line x1="506" y1="158" x2="506" y2="202" stroke-width="1" opacity="0.6"/>
        <rect x="502" y="166" width="8" height="30" fill-opacity="0.28"/>
        <line x1="618" y1="144" x2="618" y2="192" stroke-width="1" opacity="0.6"/>
        <rect x="614" y="152" width="8" height="32" fill-opacity="0.28"/>
        <line x1="674" y1="168" x2="674" y2="214" stroke-width="1" opacity="0.6"/>
        <rect x="670" y="176" width="8" height="30" fill-opacity="0.28"/>
