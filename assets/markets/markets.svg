        <line x1="590" y1="126" x2="590" y2="170" stroke-width="1" opacity="0.75"/>
        <rect x="586" y="134" width="8" height="28" fill-opacity="0.42"/>
        <line x1="646" y1="108" x2="646" y2="152" stroke-width="1" opacity="0.75"/>
